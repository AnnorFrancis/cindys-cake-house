<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery · Cindy's Cake House</title>
  <meta name="description" content="Recent wedding cakes, celebration cakes, pâtisserie and dessert tables from Cindy's Cake House in Cantonments, Accra.">
  <meta name="theme-color" content="#24130f">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <link rel="stylesheet" href="assets/css/inner.css">
</head>
<body data-page="gallery">
<main id="main">
  <section class="gl-hero bg-cocoa grain">
    <div class="wrap on-dark">
      <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span>/</span><span>Gallery</span></nav>
      <div class="gl-hero-row">
        <h1 class="h1" data-split>Recent work,|unretouched</h1>
        <p class="lede" data-reveal>Tap any cake to see it larger, and order one like it. Photographed in the house, at the venue, or by the people who ate it.</p>
      </div>
      <div class="opt-row gl-tags" id="glTags" role="tablist" aria-label="Filter the gallery"></div>
    </div>
  </section>
  <section class="section-sm bg-meringue">
    <div class="wrap-wide"><div class="masonry" id="masonry"></div></div>
  </section>
  <div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Image viewer">
    <button class="close-x lb-x" id="lbX" aria-label="Close"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l10 10M13 3 3 13"/></svg></button>
    <button class="lb-nav prev" id="lbPrev" aria-label="Previous">←</button>
    <figure class="lb-fig"><img id="lbImg" alt=""><figcaption id="lbCap"></figcaption></figure>
    <button class="lb-nav next" id="lbNext" aria-label="Next">→</button>
  </div>
  <div data-footer></div>
</main>
<script src="assets/vendor/gsap.min.js"></script>
<script src="assets/vendor/ScrollTrigger.min.js"></script>
<script src="assets/vendor/lenis.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/site.js"></script>
<script src="assets/js/concierge.js"></script>
<script src="assets/js/inner.js"></script>
</body>
</html>
