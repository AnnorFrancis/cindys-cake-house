<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Track your order · Cindy's Cake House</title>
  <meta name="description" content="Follow your cake from the oven to your door: live status from the Cindy's Cake House kitchen.">
  <meta name="theme-color" content="#24130f">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <link rel="stylesheet" href="assets/css/inner.css">
</head>
<body data-page="track">
<main id="main">
  <section class="tr-hero bg-cocoa grain">
    <div class="wrap on-dark tr-hero-in">
      <div>
        <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span>/</span><span>Track an order</span></nav>
        <h1 class="h1" data-split>From our oven|to your door</h1>
        <p class="lede" data-reveal style="margin-top:18px">Enter the reference from your confirmation. This page updates by itself as the kitchen moves your order along.</p>
      </div>
      <form class="tr-form glass" id="trForm" data-reveal>
        <label class="label" for="ref" style="color:var(--on-dark-2)">Order reference</label>
        <div class="tr-row"><input class="input mono" id="ref" placeholder="CCH-7K2QP" autocomplete="off" spellcheck="false"><button class="btn btn-pist" type="submit">Track</button></div>
        <p class="tr-hint" id="trHint">Try a recent one: <button type="button" class="link-u" id="sample"></button></p>
      </form>
    </div>
  </section>
  <section class="section bg-meringue" id="trOut" aria-live="polite">
    <div class="wrap"><div class="empty"><p class="h4">Your order will appear here.</p><p>Lost your reference? WhatsApp us your name and the date and we'll find it.</p></div></div>
  </section>
  <div data-footer></div>
</main>
<script src="assets/vendor/gsap.min.js"></script>
<script src="assets/vendor/ScrollTrigger.min.js"></script>
<script src="assets/vendor/lenis.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/site.js"></script>
<script src="assets/js/concierge.js"></script>
<script>
(function () {
  const D = CCH, S = CCHStore, U = CCHUI, B = D.BUSINESS, { $, esc, img } = U;
  const STEPS = [["received", "Order received", "We have your order and design notes."], ["confirmed", "Deposit confirmed", "Your date is held in the kitchen diary."], ["baking", "In the oven", "Sponges are baked the day before, never earlier."], ["decorating", "Decorating", "Filling, finishing and the details you chose."], ["ready", "Ready", "Boxed, chilled and checked by Cindy."], ["out", "Out for delivery", "In our air-conditioned van with two of the team."], ["delivered", "Delivered", "Enjoy every slice."]];
  let current = null;
  const recent = S.db.orders.filter(o => o.own).slice(-1)[0] || S.db.orders.filter(o => o.date === S.iso(S.today()) && o.status === "out")[0] || S.db.orders.filter(o => o.channel !== "walk-in" && o.date >= S.iso(S.today()))[0];
  if (recent) { $("#sample").textContent = recent.ref; $("#sample").onclick = () => { $("#ref").value = recent.ref; show(recent.ref); }; } else $("#trHint").hidden = true;

  function show(ref) {
    const o = S.findOrder(ref); current = o ? o.ref : null;
    const out = $("#trOut");
    if (!o) { out.innerHTML = `<div class="wrap"><div class="empty"><p class="h4">We couldn't find “${esc(ref)}”.</p><p>References look like CCH-7K2QP. Check your confirmation, or <a href="https://wa.me/${B.whatsapp}" target="_blank" rel="noopener"><u>WhatsApp Esi</u></a>.</p></div></div>`; return; }
    const st = o.status === "collected" ? "delivered" : o.status;
    const idx = STEPS.findIndex(s => s[0] === st);
    const steps = o.method === "collection" ? STEPS.filter(s => s[0] !== "out").map(s => s[0] === "delivered" ? ["delivered", "Collected", "Thank you for coming by the house."] : s[0] === "ready" ? ["ready", "Ready to collect", "Boxed and waiting at the counter."] : s) : STEPS;
    const z = o.zone ? D.ZONES.find(x => x.id === o.zone) : null;
    const pct = Math.max(0, steps.findIndex(s => s[0] === st)) / (steps.length - 1) * 100;
    out.innerHTML = `<div class="wrap tr-grid">
      <div class="tr-card">
        <div class="tr-top"><div><span class="label">Order</span><b class="mono tr-ref">${o.ref}</b></div><span class="status-pill st-${st}">${S.STATUS_LABEL[o.status]}</span></div>
        <div class="tr-bar"><i style="width:${pct}%"></i></div>
        <ol class="tr-steps">${steps.map((s, i) => { const k = steps.findIndex(x => x[0] === st); return `<li class="${i < k ? "done" : i === k ? "now" : ""}"><span class="tr-dot"></span><div><b>${s[1]}</b><small>${i === k ? s[2] : i < k ? "Done" : ""}</small></div></li>`; }).join("")}</ol>
      </div>
      <aside class="tr-side">
        <div class="tr-when"><span class="label">${o.method === "delivery" ? "Delivery" : "Collection"}</span><b class="h3">${S.fmtDate(o.date, { weekday: "long", day: "numeric", month: "long" })}</b><span class="mono">${esc(o.slot)}${z ? " · " + esc(z.name) : ""}</span>
        ${st === "out" ? `<p class="tr-live"><i></i>Driver Kwesi is on the way · about ${esc(z ? z.eta : "45 min")}</p>` : ""}</div>
        <div class="tr-items">${o.items.map(it => { const p = S.byId[it.id]; return p ? `<div class="done-item"><img src="${img(it.opts && it.opts.custom ? it.opts.custom.img : p.img)}" alt=""><span>${it.qty} × ${esc(it.opts && it.opts.custom ? it.opts.custom.name : p.name)}</span></div>` : ""; }).join("")}</div>
        <div class="kv"><span>Total</span><span class="price">${S.money(o.total)}</span></div>
        <div class="kv"><span>Paid</span><span class="price">${S.money(o.payment.paid)}</span></div>
        ${o.payment.paid < o.total ? `<div class="kv"><span>Balance</span><span class="price">${S.money(o.total - o.payment.paid)}</span></div>` : ""}
        <a class="btn btn-block" style="margin-top:16px" href="https://wa.me/${B.whatsapp}?text=${encodeURIComponent("Hello Cindy's, a question about order " + o.ref)}" target="_blank" rel="noopener">${U.I.wa} Message us about this order</a>
      </aside></div>`;
    if (U.MOTION && window.gsap) gsap.from(".tr-steps li", { x: -16, opacity: 0, duration: 0.6, stagger: 0.06, ease: "power3.out" });
    history.replaceState(null, "", "?ref=" + o.ref);
  }
  $("#trForm").addEventListener("submit", e => { e.preventDefault(); show($("#ref").value); });
  window.addEventListener("cch:db", () => { if (current) { const prev = $(".status-pill") && $(".status-pill").textContent; show(current); if (prev && prev !== $(".status-pill").textContent) U.toast(`<div><b>Update from the kitchen</b><small>${esc($(".status-pill").textContent)}</small></div>`); } });
  const q = new URLSearchParams(location.search).get("ref");
  if (q) { $("#ref").value = q; show(q); }
})();
</script>
</body>
</html>
